name: Publish extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked package to Visual Studio Marketplace
        type: boolean
        required: true
        default: false
      increment:
        description: Version change for a publish run
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - current

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check publish branch
        if: inputs.publish
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publish from the main branch."
            exit 1
          fi
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare release version
        if: inputs.publish
        env:
          RELEASE_INCREMENT: ${{ inputs.increment }}
        run: pnpm release:prepare "$RELEASE_INCREMENT"
      - name: Check source and run tests
        run: pnpm check
      - name: Test in VS Code
        run: xvfb-run -a pnpm test:editor
      - name: Build VSIX package
        run: pnpm package
      - name: Save checked package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: redirects-toolkit
          path: |
            *.vsix
            release-output/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Marketplace
    needs: check
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out checked source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install publishing tool
        run: pnpm install --frozen-lockfile
      - name: Download checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redirects-toolkit
          path: .artifacts
      - name: Verify release source and metadata
        run: node scripts/release.cjs verify .artifacts
      - name: Publish checked package with trusted publishing
        run: pnpm exec vsce publish --oidc --packagePath .artifacts/*.vsix

  record:
    name: Record release version and tag
    needs: [check, publish]
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Download checked release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redirects-toolkit
          path: .artifacts
      - name: Create release commit and tag
        id: release
        run: node scripts/release.cjs record .artifacts
      - name: Push release commit and tag together
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"
